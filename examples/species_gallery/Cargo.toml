[package]
name = "species_gallery"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Grows sylva species presets for several seeds and dumps them for Blender review"
publish = false

[dependencies]
dapple_encode = { features = ["std"], workspace = true }
exedra_mesh = { features = ["std"], workspace = true }
png = "0.18.1"
ron = "0.11.0"
skeleton_dump = { path = "../skeleton_dump" }
sylva_bake.workspace = true
sylva_foliage.workspace = true
sylva_lod.workspace = true
sylva_mesh.workspace = true
sylva_skeleton.workspace = true
sylva_species = { features = ["serde"], workspace = true }
sylva_texture.workspace = true

[lints]
workspace = true
