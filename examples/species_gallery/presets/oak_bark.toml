# Oak bark for sylva, adapted from dapple's
# `tools/dapple_bake/materials/recipes/oak_bark.toml` (dapple 9a3e95e):
# plates separated by wavy vertical fissures, damp dark fissures, weathered
# grey plate tops, lichen and mottling.
#
# One tile covers 1 m of bark (`sylva_mesh::BarkMapping`'s default
# `tile_size`). Dapple's tile holds 7 x 2 plate cells; this one holds
# 14 x 2, so ridges come out about 7 cm wide and 50 cm long, and a stronger
# wobble braids the furrows between them: a mature oak's long ridges that
# split and rejoin. A thick trunk repeats the tile only a few times around.
# Plates flatten farther in from their borders than dapple's, and colour
# darkens over more of the slope, which opens wide, dark, V-shaped furrows. Weathering, lichen and
# mottling keep dapple's frequencies, so they vary over a metre. Heights are
# in [0, 1]; 1 means 30 mm of relief, so normals and occlusion scale by 0.03
# (metres of relief per metre of tile) and the occlusion radius is 30 mm.
version = 1

# Plates stretched along y, their sizes varied by a broad warp that compresses
# some columns and widens others. Border distance is in cell units.
[[nodes]]
label = "cells"
kind = "field"
inputs = []
op = { op = "cellular", domain = { periodic = { period = [1, 1] } }, frequency = [14.0, 2.0], jitter = 1.0, seed = 7, output = "border" }

[[nodes]]
label = "stretch_x"
kind = "field"
inputs = []
op = { op = "fractal", basis = "gradient", domain = { periodic = { period = [1, 1] } }, frequency = [3.0, 5.0], seed = 29, params = {} }

[[nodes]]
label = "stretch_y"
kind = "field"
inputs = []
op = { op = "fractal", basis = "gradient", domain = { periodic = { period = [1, 1] } }, frequency = [3.0, 5.0], seed = 30, params = {} }

[[nodes]]
label = "stretched"
kind = "field"
inputs = ["cells", "stretch_x", "stretch_y"]
op = { op = "warp", input = 0, dx = 1, dy = 2, amount = 0.028 }

[[nodes]]
label = "wobble_x"
kind = "field"
inputs = []
op = { op = "fractal", basis = "gradient", domain = { periodic = { period = [1, 1] } }, frequency = [7.0, 9.0], seed = 8, params = {} }

[[nodes]]
label = "wobble_y"
kind = "field"
inputs = []
op = { op = "fractal", basis = "gradient", domain = { periodic = { period = [1, 1] } }, frequency = [7.0, 9.0], seed = 9, params = {} }

[[nodes]]
label = "wavy"
kind = "field"
inputs = ["stretched", "wobble_x", "wobble_y"]
op = { op = "warp", input = 0, dx = 1, dy = 2, amount = 0.016 }

# Plates flatten between 0.2 and 0.4 cells in from their fissures, so furrow
# width and ridge height vary across the tile.
[[nodes]]
label = "flat_noise"
kind = "field"
inputs = []
op = { op = "fractal", basis = "gradient", domain = { periodic = { period = [1, 1] } }, frequency = [9.0, 6.0], seed = 31, params = {} }

[[nodes]]
label = "flat"
kind = "field"
inputs = ["flat_noise"]
op = { op = "remap", input = 0, from = [-1.0, 1.0], to = [0.2, 0.4] }

[[nodes]]
label = "plates_flattened"
kind = "field"
inputs = ["wavy", "flat"]
op = { op = "min", a = 0, b = 1 }

[[nodes]]
label = "plates_primary"
kind = "field"
inputs = ["plates_flattened"]
op = { op = "remap", input = 0, from = [0.0, 0.4], to = [0.0, 0.85] }

# Shallow secondary cracks split some plates, in patches.
[[nodes]]
label = "crack_cells"
kind = "field"
inputs = []
op = { op = "cellular", domain = { periodic = { period = [1, 1] } }, frequency = [30.0, 6.0], jitter = 1.0, seed = 27, output = "border" }

[[nodes]]
label = "crack_warped"
kind = "field"
inputs = ["crack_cells", "wobble_x", "wobble_y"]
op = { op = "warp", input = 0, dx = 1, dy = 2, amount = 0.007 }

[[nodes]]
label = "crack_remapped"
kind = "field"
inputs = ["crack_warped"]
op = { op = "remap", input = 0, from = [0.0, 0.1], to = [0.4, 1.0] }

[[nodes]]
label = "crack_depth"
kind = "field"
inputs = ["crack_remapped"]
op = { op = "clamp", input = 0, min = 0.4, max = 1.0 }

[[nodes]]
label = "patch_noise"
kind = "field"
inputs = []
op = { op = "fractal", basis = "gradient", domain = { periodic = { period = [1, 1] } }, frequency = [6.0, 6.0], seed = 28, params = {} }

[[nodes]]
label = "patch_remapped"
kind = "field"
inputs = ["patch_noise"]
op = { op = "remap", input = 0, from = [0.1, 0.4], to = [1.0, 0.0] }

[[nodes]]
label = "patches"
kind = "field"
inputs = ["patch_remapped"]
op = { op = "clamp", input = 0, min = 0.0, max = 1.0 }

[[nodes]]
label = "cracks"
kind = "field"
inputs = ["crack_depth", "patches"]
op = { op = "max", a = 0, b = 1 }

[[nodes]]
label = "plates"
kind = "field"
inputs = ["plates_primary", "cracks"]
op = { op = "min", a = 0, b = 1 }

[[nodes]]
label = "grain_noise"
kind = "field"
inputs = []
op = { op = "fractal", basis = "gradient", domain = { periodic = { period = [1, 1] } }, frequency = [68.0, 17.0], seed = 10, params = { octaves = 4 } }

[[nodes]]
label = "grain"
kind = "field"
inputs = ["grain_noise"]
op = { op = "remap", input = 0, from = [-1.0, 1.0], to = [0.0, 0.15] }

[[nodes]]
label = "height"
kind = "field"
inputs = ["plates", "grain"]
op = { op = "add", a = 0, b = 1 }

# Linear base color: damp dark fissures, brown bark that weathers grey on
# exposed plate tops, lichen on some plates, and large-scale mottling.

[[nodes]]
label = "fissure_color_r"
kind = "field"
inputs = []
op = { op = "constant", domain = { periodic = { period = [1, 1] } }, value = 0.016 }

[[nodes]]
label = "fissure_color_g"
kind = "field"
inputs = []
op = { op = "constant", domain = { periodic = { period = [1, 1] } }, value = 0.012 }

[[nodes]]
label = "fissure_color_b"
kind = "field"
inputs = []
op = { op = "constant", domain = { periodic = { period = [1, 1] } }, value = 0.01 }

[[nodes]]
label = "fissure_color"
kind = "field"
inputs = ["fissure_color_r", "fissure_color_g", "fissure_color_b"]
op = { op = "color", r = 0, g = 1, b = 2 }

[[nodes]]
label = "bark_color_r"
kind = "field"
inputs = []
op = { op = "constant", domain = { periodic = { period = [1, 1] } }, value = 0.085 }

[[nodes]]
label = "bark_color_g"
kind = "field"
inputs = []
op = { op = "constant", domain = { periodic = { period = [1, 1] } }, value = 0.068 }

[[nodes]]
label = "bark_color_b"
kind = "field"
inputs = []
op = { op = "constant", domain = { periodic = { period = [1, 1] } }, value = 0.052 }

[[nodes]]
label = "bark_color"
kind = "field"
inputs = ["bark_color_r", "bark_color_g", "bark_color_b"]
op = { op = "color", r = 0, g = 1, b = 2 }

[[nodes]]
label = "weathered_color_r"
kind = "field"
inputs = []
op = { op = "constant", domain = { periodic = { period = [1, 1] } }, value = 0.125 }

[[nodes]]
label = "weathered_color_g"
kind = "field"
inputs = []
op = { op = "constant", domain = { periodic = { period = [1, 1] } }, value = 0.12 }

[[nodes]]
label = "weathered_color_b"
kind = "field"
inputs = []
op = { op = "constant", domain = { periodic = { period = [1, 1] } }, value = 0.11 }

[[nodes]]
label = "weathered_color"
kind = "field"
inputs = ["weathered_color_r", "weathered_color_g", "weathered_color_b"]
op = { op = "color", r = 0, g = 1, b = 2 }

[[nodes]]
label = "lichen_color_r"
kind = "field"
inputs = []
op = { op = "constant", domain = { periodic = { period = [1, 1] } }, value = 0.12 }

[[nodes]]
label = "lichen_color_g"
kind = "field"
inputs = []
op = { op = "constant", domain = { periodic = { period = [1, 1] } }, value = 0.15 }

[[nodes]]
label = "lichen_color_b"
kind = "field"
inputs = []
op = { op = "constant", domain = { periodic = { period = [1, 1] } }, value = 0.07 }

[[nodes]]
label = "lichen_color"
kind = "field"
inputs = ["lichen_color_r", "lichen_color_g", "lichen_color_b"]
op = { op = "color", r = 0, g = 1, b = 2 }

# Damp fissure depths darken toward the bark's brown on the plates.

[[nodes]]
label = "depth_raw"
kind = "field"
inputs = ["height"]
op = { op = "remap", input = 0, from = [0.0, 0.75], to = [0.0, 1.0] }

[[nodes]]
label = "depth"
kind = "field"
inputs = ["depth_raw"]
op = { op = "clamp", input = 0, min = 0.0, max = 1.0 }

[[nodes]]
label = "brown"
kind = "field"
inputs = ["fissure_color", "bark_color", "depth"]
op = { op = "mix", a = 0, b = 1, t = 2 }

# Exposed plate tops weather grey, in patches. Sylva reads the plates before
# secondary cracks, so weathering follows whole plate tops instead of the
# torn outlines of crack-free regions.

[[nodes]]
label = "top_raw"
kind = "field"
inputs = ["plates_primary"]
op = { op = "remap", input = 0, from = [0.45, 0.8], to = [0.0, 1.0] }

[[nodes]]
label = "top"
kind = "field"
inputs = ["top_raw"]
op = { op = "clamp", input = 0, min = 0.0, max = 1.0 }

[[nodes]]
label = "weather_noise"
kind = "field"
inputs = []
op = { op = "fractal", basis = "gradient", domain = { periodic = { period = [1, 1] } }, frequency = [4.0, 3.0], seed = 11, params = { octaves = 4 } }

[[nodes]]
label = "weather_patches_raw"
kind = "field"
inputs = ["weather_noise"]
op = { op = "remap", input = 0, from = [-0.25, 0.65], to = [0.0, 0.9] }

[[nodes]]
label = "weather_patches"
kind = "field"
inputs = ["weather_patches_raw"]
op = { op = "clamp", input = 0, min = 0.0, max = 0.9 }

[[nodes]]
label = "weather"
kind = "field"
inputs = ["top", "weather_patches"]
op = { op = "mul", a = 0, b = 1 }

[[nodes]]
label = "weathered"
kind = "field"
inputs = ["brown", "weathered_color", "weather"]
op = { op = "mix", a = 0, b = 1, t = 2 }

# Sparse lichen on the plates, never in the fissures.

[[nodes]]
label = "plate_raw"
kind = "field"
inputs = ["height"]
op = { op = "remap", input = 0, from = [0.45, 0.8], to = [0.0, 1.0] }

[[nodes]]
label = "plate"
kind = "field"
inputs = ["plate_raw"]
op = { op = "clamp", input = 0, min = 0.0, max = 1.0 }

[[nodes]]
label = "lichen_noise"
kind = "field"
inputs = []
op = { op = "fractal", basis = "gradient", domain = { periodic = { period = [1, 1] } }, frequency = [3.0, 2.0], seed = 12, params = { octaves = 5 } }

[[nodes]]
label = "lichen_patches_raw"
kind = "field"
inputs = ["lichen_noise"]
op = { op = "remap", input = 0, from = [0.0, 0.45], to = [0.0, 0.8] }

[[nodes]]
label = "lichen_patches"
kind = "field"
inputs = ["lichen_patches_raw"]
op = { op = "clamp", input = 0, min = 0.0, max = 0.8 }

[[nodes]]
label = "lichen"
kind = "field"
inputs = ["plate", "lichen_patches"]
op = { op = "mul", a = 0, b = 1 }

[[nodes]]
label = "lichened"
kind = "field"
inputs = ["weathered", "lichen_color", "lichen"]
op = { op = "mix", a = 0, b = 1, t = 2 }

# Large-scale mottling of the whole tile.

[[nodes]]
label = "mottle_noise"
kind = "field"
inputs = []
op = { op = "fractal", basis = "gradient", domain = { periodic = { period = [1, 1] } }, frequency = [2.0, 2.0], seed = 13, params = { octaves = 3 } }

[[nodes]]
label = "mottle"
kind = "field"
inputs = ["mottle_noise"]
op = { op = "remap", input = 0, from = [-1.0, 1.0], to = [0.7, 1.3] }

[[nodes]]
label = "color"
kind = "field"
inputs = ["lichened", "mottle"]
op = { op = "mul", a = 0, b = 1 }

[[nodes]]
label = "red"
kind = "field"
inputs = ["color"]
op = { op = "component", input = 0, index = 0 }

[[nodes]]
label = "green"
kind = "field"
inputs = ["color"]
op = { op = "component", input = 0, index = 1 }

[[nodes]]
label = "blue"
kind = "field"
inputs = ["color"]
op = { op = "component", input = 0, index = 2 }

# Fissures are rougher than plate tops.
[[nodes]]
label = "height_unit"
kind = "field"
inputs = ["height"]
op = { op = "clamp", input = 0, min = 0.0, max = 1.0 }

[[nodes]]
label = "roughness"
kind = "field"
inputs = ["height_unit"]
op = { op = "remap", input = 0, from = [0.0, 1.0], to = [0.9, 0.55] }

[[nodes]]
label = "height_map"
kind = "realize"
input = "height"
width = 1024
height = 1024

[[nodes]]
label = "red_map"
kind = "realize"
input = "red"
width = 1024
height = 1024

[[nodes]]
label = "green_map"
kind = "realize"
input = "green"
width = 1024
height = 1024

[[nodes]]
label = "blue_map"
kind = "realize"
input = "blue"
width = 1024
height = 1024

[[nodes]]
label = "roughness_map"
kind = "realize"
input = "roughness"
width = 1024
height = 1024

[[nodes]]
label = "normal_map"
kind = "raster"
input = "height_map"
params = { op = "height_to_normal", scale = 0.05 }

[[nodes]]
label = "ao_map"
kind = "raster"
input = "height_map"
params = { op = "ambient_occlusion", radius = 0.04, directions = 12, scale = 0.05 }

[[outputs]]
role = "base_color"
channels = ["red_map", "green_map", "blue_map"]

[[outputs]]
role = "normal"
channels = ["normal_map"]

[[outputs]]
role = "specular_roughness"
channels = ["roughness_map"]

[[outputs]]
role = "occlusion"
channels = ["ao_map"]
